# Content review by lychen, as confirmed by Jiabin. Timing remains unmeasured.
templates:
  - template_id: activity_choose_your_route
    title: "Choose Your Route"
    category: any
    duration_bucket: 60
    weather_tags: [dry]
    site_requirements: [bare_site, open_space]
    equipment: []
    mechanic: sequence
    safety_tags: [inherited]
    review: {author: Jiabin, reviewed_by: lychen, status: reviewed}
    bands:
      "5-7":
        title: null
        steps:
          - sequence: 1
            prompt_text: "With me, choose a nearby spot in our checked area."
            verify_mode: self
            prompt_id: null
            variable: true
          - sequence: 2
            prompt_text: "Walk slowly beside me to that spot."
            verify_mode: self
            prompt_id: null
            variable: true
          - sequence: 3
            prompt_text: "Choose another checked spot and walk there together."
            verify_mode: self
            prompt_id: null
            variable: true
          - sequence: 4
            prompt_text: "Pick a nearby stopping spot we can both reach easily."
            verify_mode: self
            prompt_id: null
            variable: true
          - sequence: 5
            prompt_text: "Walk there beside me and settle both feet."
            verify_mode: self
            prompt_id: null
            variable: true
          - sequence: 6
            prompt_text: "Choose the shortest checked walk we have tried."
            verify_mode: self
            prompt_id: null
            variable: true
          - sequence: 7
            prompt_text: "Walk it together and point to where we started."
            verify_mode: self
            prompt_id: null
            variable: true
      "8-10":
        title: null
        steps:
          - sequence: 1
            prompt_text: "Choose two nearby stopping positions your adult has checked."
            verify_mode: self
            prompt_id: null
            variable: true
          - sequence: 2
            prompt_text: "Walk forwards together through your chosen positions."
            verify_mode: self
            prompt_id: null
            variable: true
          - sequence: 3
            prompt_text: "Explain your route and walk together to a comfortable stopping place."
            verify_mode: self
            prompt_id: null
            variable: true
          - sequence: 4
            prompt_text: "Reverse the visiting order without walking backwards."
            verify_mode: self
            prompt_id: null
            variable: true
          - sequence: 5
            prompt_text: "Try that order together and compare the two routes."
            verify_mode: self
            prompt_id: null
            variable: true
          - sequence: 6
            prompt_text: "Let your adult choose a shorter route in the checked area."
            verify_mode: self
            prompt_id: null
            variable: true
          - sequence: 7
            prompt_text: "Follow it together and describe which stop was removed."
            verify_mode: self
            prompt_id: null
            variable: true
      "11-12":
        title: null
        steps:
          - sequence: 1
            prompt_text: "Plan a short route using three nearby adult-checked positions."
            verify_mode: self
            prompt_id: null
            variable: true
          - sequence: 2
            prompt_text: "Explain the visiting order and walk it beside your adult."
            verify_mode: self
            prompt_id: null
            variable: true
          - sequence: 3
            prompt_text: "Identify one unnecessary movement and finish at a checked position."
            verify_mode: self
            prompt_id: null
            variable: true
          - sequence: 4
            prompt_text: "Revise the visiting order to make the route simpler."
            verify_mode: self
            prompt_id: null
            variable: true
          - sequence: 5
            prompt_text: "Test the revision together and explain the difference."
            verify_mode: self
            prompt_id: null
            variable: true
          - sequence: 6
            prompt_text: "Design a second route using fewer stopping positions."
            verify_mode: self
            prompt_id: null
            variable: true
          - sequence: 7
            prompt_text: "Walk the shorter route and compare how easily it can be explained."
            verify_mode: self
            prompt_id: null
            variable: true
