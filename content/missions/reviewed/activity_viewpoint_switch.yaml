# Content review by lychen, as confirmed by Jiabin. Timing remains unmeasured.
templates:
  - template_id: activity_viewpoint_switch
    title: "Viewpoint Switch"
    category: any
    duration_bucket: 60
    weather_tags: [any]
    site_requirements: [bare_site, open_space]
    equipment: []
    mechanic: find
    safety_tags: [inherited]
    review: {author: Jiabin, reviewed_by: lychen, status: reviewed}
    bands:
      "5-7":
        title: null
        steps:
          - sequence: 1
            prompt_text: "Beside me, choose something we can see without touching."
            verify_mode: self
            prompt_id: null
            variable: true
          - sequence: 2
            prompt_text: "Point to one shape you notice."
            verify_mode: self
            prompt_id: null
            variable: true
          - sequence: 3
            prompt_text: "Describe that shape to me from our standing spot."
            verify_mode: self
            prompt_id: null
            variable: true
          - sequence: 4
            prompt_text: "Walk with me to another nearby checked standing spot."
            verify_mode: self
            prompt_id: null
            variable: true
          - sequence: 5
            prompt_text: "Look again and tell me what seems different."
            verify_mode: self
            prompt_id: null
            variable: true
          - sequence: 6
            prompt_text: "Choose which checked spot gave your clearest view."
            verify_mode: self
            prompt_id: null
            variable: true
          - sequence: 7
            prompt_text: "Return there together and point out your chosen shape."
            verify_mode: self
            prompt_id: null
            variable: true
      "8-10":
        title: null
        steps:
          - sequence: 1
            prompt_text: "Choose a visible feature beside your adult without touching it."
            verify_mode: self
            prompt_id: null
            variable: true
          - sequence: 2
            prompt_text: "Describe its outline from your current checked position."
            verify_mode: self
            prompt_id: null
            variable: true
          - sequence: 3
            prompt_text: "Compare your description with your adult's view from beside you."
            verify_mode: self
            prompt_id: null
            variable: true
          - sequence: 4
            prompt_text: "Walk together to a second nearby checked position."
            verify_mode: self
            prompt_id: null
            variable: true
          - sequence: 5
            prompt_text: "Identify one changed detail and one detail that stayed the same."
            verify_mode: self
            prompt_id: null
            variable: true
          - sequence: 6
            prompt_text: "Choose which position best shows your selected detail."
            verify_mode: self
            prompt_id: null
            variable: true
          - sequence: 7
            prompt_text: "Return there together and explain why the detail is clearer."
            verify_mode: self
            prompt_id: null
            variable: true
      "11-12":
        title: null
        steps:
          - sequence: 1
            prompt_text: "Predict how a visible feature might look from another checked position."
            verify_mode: self
            prompt_id: null
            variable: true
          - sequence: 2
            prompt_text: "Describe its current outline while standing beside your adult."
            verify_mode: self
            prompt_id: null
            variable: true
          - sequence: 3
            prompt_text: "Explain which part of your prediction can be compared visually."
            verify_mode: self
            prompt_id: null
            variable: true
          - sequence: 4
            prompt_text: "Walk forwards together to the second nearby checked position."
            verify_mode: self
            prompt_id: null
            variable: true
          - sequence: 5
            prompt_text: "Compare the new view with your prediction and explain a difference."
            verify_mode: self
            prompt_id: null
            variable: true
          - sequence: 6
            prompt_text: "Choose the viewpoint that best supports one specific observation."
            verify_mode: self
            prompt_id: null
            variable: true
          - sequence: 7
            prompt_text: "Return together and explain what the comparison cannot establish."
            verify_mode: self
            prompt_id: null
            variable: true
