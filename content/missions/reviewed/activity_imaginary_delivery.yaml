# Content review by lychen, as confirmed by Jiabin. Timing remains unmeasured.
templates:
  - template_id: activity_imaginary_delivery
    title: "Imaginary Delivery"
    category: any
    duration_bucket: 60
    weather_tags: [dry]
    site_requirements: [bare_site, open_space]
    equipment: []
    mechanic: imagine
    safety_tags: [inherited]
    review: {author: Jiabin, reviewed_by: lychen, status: reviewed}
    bands:
      "5-7":
        title: null
        steps:
          - sequence: 1
            prompt_text: "Beside me, pretend your empty hands hold a tiny parcel."
            verify_mode: self
            prompt_id: null
            variable: true
          - sequence: 2
            prompt_text: "Show me how you would hold it gently."
            verify_mode: self
            prompt_id: null
            variable: true
          - sequence: 3
            prompt_text: "Pretend to give it to me and describe its contents."
            verify_mode: self
            prompt_id: null
            variable: true
          - sequence: 4
            prompt_text: "Imagine another parcel with a different shape."
            verify_mode: self
            prompt_id: null
            variable: true
          - sequence: 5
            prompt_text: "Show its shape and pretend to hand it over."
            verify_mode: self
            prompt_id: null
            variable: true
          - sequence: 6
            prompt_text: "Choose a funny imaginary parcel for me to copy."
            verify_mode: self
            prompt_id: null
            variable: true
          - sequence: 7
            prompt_text: "Demonstrate its delivery and compare our pretend parcels."
            verify_mode: self
            prompt_id: null
            variable: true
      "8-10":
        title: null
        steps:
          - sequence: 1
            prompt_text: "Invent a parcel and a nearby destination your adult checks."
            verify_mode: self
            prompt_id: null
            variable: true
          - sequence: 2
            prompt_text: "Walk beside your adult while pretending to carry the parcel."
            verify_mode: self
            prompt_id: null
            variable: true
          - sequence: 3
            prompt_text: "Mime handing it over and explain what made it unusual."
            verify_mode: self
            prompt_id: null
            variable: true
          - sequence: 4
            prompt_text: "Imagine its contents change without adding any real weight."
            verify_mode: self
            prompt_id: null
            variable: true
          - sequence: 5
            prompt_text: "Demonstrate the changed delivery while staying in the checked space."
            verify_mode: self
            prompt_id: null
            variable: true
          - sequence: 6
            prompt_text: "Let your adult suggest a new imaginary recipient."
            verify_mode: self
            prompt_id: null
            variable: true
          - sequence: 7
            prompt_text: "Mime a delivery to that pretend recipient and explain your choices."
            verify_mode: self
            prompt_id: null
            variable: true
      "11-12":
        title: null
        steps:
          - sequence: 1
            prompt_text: "Invent a parcel with one unusual imaginary handling requirement."
            verify_mode: self
            prompt_id: null
            variable: true
          - sequence: 2
            prompt_text: "Plan a short delivery within positions your adult has checked."
            verify_mode: self
            prompt_id: null
            variable: true
          - sequence: 3
            prompt_text: "Perform it beside your adult and explain the handling choice."
            verify_mode: self
            prompt_id: null
            variable: true
          - sequence: 4
            prompt_text: "Change the imaginary requirement without adding real obstacles or weight."
            verify_mode: self
            prompt_id: null
            variable: true
          - sequence: 5
            prompt_text: "Adapt your delivery and compare it with the first version."
            verify_mode: self
            prompt_id: null
            variable: true
          - sequence: 6
            prompt_text: "Ask your adult to suggest a different pretend purpose."
            verify_mode: self
            prompt_id: null
            variable: true
          - sequence: 7
            prompt_text: "Perform a revised handover and explain how the purpose changed it."
            verify_mode: self
            prompt_id: null
            variable: true
