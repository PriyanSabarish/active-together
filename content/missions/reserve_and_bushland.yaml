  weather_tags:
  - dry
  site_requirements:
  - path
  - trees
  equipment: []
  mechanic: find
  bands:
    5-7:
      title: null
      steps:
      - sequence: 1
        prompt_text: Walk on the path and find a big tree trunk.
        verify_mode: photo
        prompt_id: p_tree_trunk
