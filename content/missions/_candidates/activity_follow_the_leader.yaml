templates:
  - template_id: activity_follow_the_leader
    title: "Follow the Leader"
    category: any
    duration_bucket: 60
    weather_tags: [dry]
    site_requirements: [bare_site, open_space]
    equipment: []
    mechanic: move
    safety_tags: [inherited]
    review: {author: Jiabin, reviewed_by: null, status: draft}
    bands:
      "5-7":
        title: null
        steps:
          - sequence: 1
            prompt_text: "In our checked space, copy my slow marching steps."
            verify_mode: self
            prompt_id: null
            variable: true
          - sequence: 2
            prompt_text: "Copy my small arm circles while staying still."
            verify_mode: self
            prompt_id: null
            variable: true
          - sequence: 3
            prompt_text: "Choose a gentle movement for me to copy."
            verify_mode: self
            prompt_id: null
            variable: true
          - sequence: 4
            prompt_text: "Copy my march followed by one arm circle."
            verify_mode: self
            prompt_id: null
            variable: true
          - sequence: 5
            prompt_text: "Lead those two movements, then return to standing."
            verify_mode: self
            prompt_id: null
            variable: true
          - sequence: 6
            prompt_text: "Choose a smaller version of one movement."
            verify_mode: self
            prompt_id: null
            variable: true
          - sequence: 7
            prompt_text: "Teach me your smaller movement, then stand comfortably."
            verify_mode: self
            prompt_id: null
            variable: true
      "8-10":
        title: null
        steps:
          - sequence: 1
            prompt_text: "Beside your adult, copy a gentle two-movement pattern."
            verify_mode: self
            prompt_id: null
            variable: true
          - sequence: 2
            prompt_text: "Repeat the pattern with a pause between movements."
            verify_mode: self
            prompt_id: null
            variable: true
          - sequence: 3
            prompt_text: "Lead your own two-movement pattern, then return to standing."
            verify_mode: self
            prompt_id: null
            variable: true
          - sequence: 4
            prompt_text: "Change the order of your two movements."
            verify_mode: self
            prompt_id: null
            variable: true
          - sequence: 5
            prompt_text: "Teach the changed pattern and finish standing comfortably."
            verify_mode: self
            prompt_id: null
            variable: true
          - sequence: 6
            prompt_text: "Let your adult change one part of the pattern."
            verify_mode: self
            prompt_id: null
            variable: true
          - sequence: 7
            prompt_text: "Notice the change and copy the new pattern gently."
            verify_mode: self
            prompt_id: null
            variable: true
      "11-12":
        title: null
        steps:
          - sequence: 1
            prompt_text: "Plan a short grounded movement pattern in your adult-checked space."
            verify_mode: self
            prompt_id: null
            variable: true
          - sequence: 2
            prompt_text: "Teach your adult the pattern using clear movement cues."
            verify_mode: self
            prompt_id: null
            variable: true
          - sequence: 3
            prompt_text: "Try your adult's suggested adjustment, then return to standing."
            verify_mode: self
            prompt_id: null
            variable: true
          - sequence: 4
            prompt_text: "Change one transition to make the pattern easier to follow."
            verify_mode: self
            prompt_id: null
            variable: true
          - sequence: 5
            prompt_text: "Test both versions together and describe the clearer transition."
            verify_mode: self
            prompt_id: null
            variable: true
          - sequence: 6
            prompt_text: "Design a simpler version with fewer movement changes."
            verify_mode: self
            prompt_id: null
            variable: true
          - sequence: 7
            prompt_text: "Teach the simpler version and compare how it feels."
            verify_mode: self
            prompt_id: null
            variable: true
