# CANDIDATE BATCH - cycling_track_move_wet. Drafted, not reviewed, not in the served library.
# Move a family into missions/<category>.yaml only after human review.

templates:
- template_id: speed_challenge
  title: Speed Challenge
  category: cycling_track
  duration_bucket: 60
  weather_tags:
  - wet
  site_requirements:
  - path
  equipment: []
  mechanic: move
  step_count: 7
  safety_tags:
  - inherited
  review:
    author: bulk-draft
    reviewed_by: null
    status: draft
  bands:
    5-7:
      steps:
      - sequence: 1
        prompt_text: Ride to a tree you can see and stop.
        verify_mode: self
        prompt_id: null
        variable: true
      - sequence: 2
        prompt_text: Turn around and ride back to where you started.
        verify_mode: self
        prompt_id: null
        variable: true
      - sequence: 3
        prompt_text: Ride to a different tree you can see and stop.
        verify_mode: self
        prompt_id: null
        variable: true
      - sequence: 4
        prompt_text: Ride back and count each pedal push you make.
        verify_mode: self
        prompt_id: null
        variable: true
      - sequence: 5
        prompt_text: Ride the same way again and try using fewer pushes.
        verify_mode: self
        prompt_id: null
        variable: true
      - sequence: 6
        prompt_text: Find a farther tree, ride there and back.
        verify_mode: self
        prompt_id: null
        variable: true
      - sequence: 7
        prompt_text: Ride back to start and try to beat your best push count.
        verify_mode: self
        prompt_id: null
        variable: true
    8-10:
      steps:
      - sequence: 1
        prompt_text: Ride to a tree you can see and stop.
        verify_mode: self
        prompt_id: null
        variable: true
      - sequence: 2
        prompt_text: Turn around and ride back to the starting point.
        verify_mode: self
        prompt_id: null
        variable: true
      - sequence: 3
        prompt_text: Ride to another visible tree and stop.
        verify_mode: self
        prompt_id: null
        variable: true
      - sequence: 4
        prompt_text: Ride back and count the number of pedal pushes you make.
        verify_mode: self
        prompt_id: null
        variable: true
      - sequence: 5
        prompt_text: Ride the same route again and try to use at least two fewer pushes than before.
        verify_mode: self
        prompt_id: null
        variable: true
      - sequence: 6
        prompt_text: Choose a tree farther away, ride there, turn, and ride back.
        verify_mode: self
        prompt_id: null
        variable: true
      - sequence: 7
        prompt_text: Finish by riding back to the start and see if you can beat your best push count from earlier.
        verify_mode: self
        prompt_id: null
        variable: true
    11-12:
      steps:
      - sequence: 1
        prompt_text: Ride to a tree you can see, stop, and note how far it feels.
        verify_mode: self
        prompt_id: null
        variable: true
      - sequence: 2
        prompt_text: Turn around and ride back to the start, noticing how long it takes.
        verify_mode: self
        prompt_id: null
        variable: true
      - sequence: 3
        prompt_text: Ride to a second tree, stop, and compare its distance to the first.
        verify_mode: self
        prompt_id: null
        variable: true
      - sequence: 4
        prompt_text: Ride back and count each pedal push, then write down the number.
        verify_mode: self
        prompt_id: null
        variable: true
      - sequence: 5
        prompt_text: Ride the same path again, aiming to reduce your push count by at least three.
        verify_mode: self
        prompt_id: null
        variable: true
      - sequence: 6
        prompt_text: Select the farthest tree you can spot, ride there, turn, and ride back, timing yourself.
        verify_mode: self
        prompt_id: null
        variable: true
      - sequence: 7
        prompt_text: Return to the start and decide whether you improved your time or push count, and explain why.
        verify_mode: self
        prompt_id: null
        variable: true
