# Migrated draft by Jiabin. No human review or timing measurement is claimed.
templates:
  - template_id: activity_sort_and_step
    title: "Sort and Step"
    category: any
    duration_bucket: 60
    weather_tags: [dry]
    site_requirements: [bare_site, open_space]
    equipment: []
    mechanic: count
    safety_tags: [inherited]
    review: {author: Jiabin, reviewed_by: null, status: draft}
    bands:
      "5-7":
        title: null
        steps:
          - sequence: 1
            prompt_text: "Beside me, name an animal and a vehicle."
            verify_mode: self
            prompt_id: null
            variable: true
          - sequence: 2
            prompt_text: "Show low hands for animals, high hands for vehicles."
            verify_mode: self
            prompt_id: null
            variable: true
          - sequence: 3
            prompt_text: "Sort my two spoken names using those hand positions."
            verify_mode: self
            prompt_id: null
            variable: true
          - sequence: 4
            prompt_text: "Give me an animal name for low hands."
            verify_mode: self
            prompt_id: null
            variable: true
          - sequence: 5
            prompt_text: "Give me a vehicle name and check my high hands."
            verify_mode: self
            prompt_id: null
            variable: true
          - sequence: 6
            prompt_text: "Choose which group means one gentle marching step."
            verify_mode: self
            prompt_id: null
            variable: true
          - sequence: 7
            prompt_text: "Sort two spoken names using our chosen movements."
            verify_mode: self
            prompt_id: null
            variable: true
      "8-10":
        title: null
        steps:
          - sequence: 1
            prompt_text: "Choose four familiar spoken names with your adult."
            verify_mode: self
            prompt_id: null
            variable: true
          - sequence: 2
            prompt_text: "Agree two groups and a comfortable hand position for each."
            verify_mode: self
            prompt_id: null
            variable: true
          - sequence: 3
            prompt_text: "Sort the four names and explain one choice."
            verify_mode: self
            prompt_id: null
            variable: true
          - sequence: 4
            prompt_text: "Choose a different grouping rule for the same names."
            verify_mode: self
            prompt_id: null
            variable: true
          - sequence: 5
            prompt_text: "Sort them again and compare where one name belongs."
            verify_mode: self
            prompt_id: null
            variable: true
          - sequence: 6
            prompt_text: "Assign one gentle on-the-spot movement to each group."
            verify_mode: self
            prompt_id: null
            variable: true
          - sequence: 7
            prompt_text: "Take turns sorting spoken names with the agreed movements."
            verify_mode: self
            prompt_id: null
            variable: true
      "11-12":
        title: null
        steps:
          - sequence: 1
            prompt_text: "Choose four familiar spoken objects and define two clear groups."
            verify_mode: self
            prompt_id: null
            variable: true
          - sequence: 2
            prompt_text: "Assign a comfortable hand position to each group."
            verify_mode: self
            prompt_id: null
            variable: true
          - sequence: 3
            prompt_text: "Classify the objects and explain one borderline choice."
            verify_mode: self
            prompt_id: null
            variable: true
          - sequence: 4
            prompt_text: "Change the grouping rule without changing the four objects."
            verify_mode: self
            prompt_id: null
            variable: true
          - sequence: 5
            prompt_text: "Classify them again and explain which assignments changed."
            verify_mode: self
            prompt_id: null
            variable: true
          - sequence: 6
            prompt_text: "Define a simple grounded movement for each revised group."
            verify_mode: self
            prompt_id: null
            variable: true
          - sequence: 7
            prompt_text: "Test your adult's classifications and clarify one ambiguous rule."
            verify_mode: self
            prompt_id: null
            variable: true
