# Migrated draft by Jiabin. No human review or timing measurement is claimed.
templates:
  - template_id: activity_pass_and_move
    title: "Pass and Move"
    category: any
    duration_bucket: 60
    weather_tags: [dry]
    site_requirements: [bare_site, open_space]
    equipment: [ball]
    mechanic: move
    safety_tags: [inherited]
    review: {author: Jiabin, reviewed_by: null, status: draft}
    bands:
      "5-7":
        title: null
        steps:
          - sequence: 1
            prompt_text: "Face me in our checked space with our soft ball."
            verify_mode: self
            prompt_id: null
            variable: true
          - sequence: 2
            prompt_text: "Roll the ball gently towards my waiting hands."
            verify_mode: self
            prompt_id: null
            variable: true
          - sequence: 3
            prompt_text: "Stop my gentle return roll and hold the ball still."
            verify_mode: self
            prompt_id: null
            variable: true
          - sequence: 4
            prompt_text: "Let me hold the ball while we move slightly closer."
            verify_mode: self
            prompt_id: null
            variable: true
          - sequence: 5
            prompt_text: "Roll once each from here and stop the ball."
            verify_mode: self
            prompt_id: null
            variable: true
          - sequence: 6
            prompt_text: "Choose our closer position or our first checked position."
            verify_mode: self
            prompt_id: null
            variable: true
          - sequence: 7
            prompt_text: "Roll once each there and finish holding the ball."
            verify_mode: self
            prompt_id: null
            variable: true
      "8-10":
        title: null
        steps:
          - sequence: 1
            prompt_text: "Face your adult with a soft ball in the checked area."
            verify_mode: self
            prompt_id: null
            variable: true
          - sequence: 2
            prompt_text: "Roll it gently towards their waiting hands."
            verify_mode: self
            prompt_id: null
            variable: true
          - sequence: 3
            prompt_text: "Receive the return roll and describe what helped you stop it."
            verify_mode: self
            prompt_id: null
            variable: true
          - sequence: 4
            prompt_text: "While the adult holds the ball, agree slightly closer positions."
            verify_mode: self
            prompt_id: null
            variable: true
          - sequence: 5
            prompt_text: "Move together, roll once each and compare the shorter distance."
            verify_mode: self
            prompt_id: null
            variable: true
          - sequence: 6
            prompt_text: "Choose one gentle rolling adjustment without increasing force."
            verify_mode: self
            prompt_id: null
            variable: true
          - sequence: 7
            prompt_text: "Try the adjustment together and finish with the ball stopped."
            verify_mode: self
            prompt_id: null
            variable: true
      "11-12":
        title: null
        steps:
          - sequence: 1
            prompt_text: "Agree comfortable rolling positions in an adult-checked level area."
            verify_mode: self
            prompt_id: null
            variable: true
          - sequence: 2
            prompt_text: "Roll a soft ball to your adult and receive the return."
            verify_mode: self
            prompt_id: null
            variable: true
          - sequence: 3
            prompt_text: "Identify one adjustment that made the exchange easier to control."
            verify_mode: self
            prompt_id: null
            variable: true
          - sequence: 4
            prompt_text: "Pause with the ball held and agree a shorter rolling distance."
            verify_mode: self
            prompt_id: null
            variable: true
          - sequence: 5
            prompt_text: "Move together, test the exchange and compare control at both distances."
            verify_mode: self
            prompt_id: null
            variable: true
          - sequence: 6
            prompt_text: "Choose a simple cue for when the receiver is ready."
            verify_mode: self
            prompt_id: null
            variable: true
          - sequence: 7
            prompt_text: "Test the cue over another exchange and finish holding the ball."
            verify_mode: self
            prompt_id: null
            variable: true
