    equipment: []
    mechanic: find
    safety_tags: [inherited]
    review: {author: Jiabin, reviewed_by: null, status: draft}
    bands:
      "5-7":
        title: null
        steps:
          - sequence: 1
            prompt_text: "Beside me, point to a colour you can see."
            verify_mode: self
            prompt_id: null
            variable: true
          - sequence: 2
            prompt_text: "Point to another colour from the same spot."
            verify_mode: self
            prompt_id: null
            variable: true
          - sequence: 3
            prompt_text: "Choose a visible colour and help me find it."
            verify_mode: self
            prompt_id: null
            variable: true
          - sequence: 4
            prompt_text: "Point to two things sharing a colour."
            verify_mode: self
            prompt_id: null
            variable: true
          - sequence: 5
            prompt_text: "Show me one colour difference between them."
            verify_mode: self
            prompt_id: null
            variable: true
          - sequence: 6
            prompt_text: "Choose a colour clue for something nearby."
            verify_mode: self
            prompt_id: null
            variable: true
          - sequence: 7
            prompt_text: "Reveal your choice and compare our colour descriptions."
            verify_mode: self
            prompt_id: null
            variable: true
      "8-10":
        title: null
        steps:
          - sequence: 1
            prompt_text: "Find two visible colours beside your adult."
            verify_mode: self
            prompt_id: null
            variable: true
          - sequence: 2
            prompt_text: "Describe one difference between your two choices."
            verify_mode: self
            prompt_id: null
            variable: true
          - sequence: 3
            prompt_text: "Give your adult a colour clue, then reveal your choice."
            verify_mode: self
            prompt_id: null
            variable: true
          - sequence: 4
            prompt_text: "Find two examples of a similar shade."
            verify_mode: self
            prompt_id: null
            variable: true
          - sequence: 5
            prompt_text: "Compare the examples and explain what makes them similar."
            verify_mode: self
            prompt_id: null
            variable: true
          - sequence: 6
            prompt_text: "Let your adult choose a different colour clue."
            verify_mode: self
            prompt_id: null
            variable: true
          - sequence: 7
            prompt_text: "Solve the clue together and describe the colour you found."
            verify_mode: self
            prompt_id: null
            variable: true
      "11-12":
        title: null
        steps:
          - sequence: 1
            prompt_text: "Choose a rule for comparing colours visible beside your adult."
            verify_mode: self
            prompt_id: null
            variable: true
          - sequence: 2
            prompt_text: "Find two examples that fit your comparison rule."
            verify_mode: self
            prompt_id: null
            variable: true
          - sequence: 3
            prompt_text: "Teach your rule, then compare your adult's choice with yours."
            verify_mode: self
            prompt_id: null
            variable: true
          - sequence: 4
            prompt_text: "Change the rule to explore a different colour relationship."
            verify_mode: self
            prompt_id: null
            variable: true
          - sequence: 5
            prompt_text: "Apply the new rule and explain how the results differ."
            verify_mode: self
            prompt_id: null
            variable: true
          - sequence: 6
            prompt_text: "Create a short colour clue using your preferred rule."
            verify_mode: self
            prompt_id: null
            variable: true
          - sequence: 7
            prompt_text: "Test the clue with your adult and explain any ambiguity."
            verify_mode: self
            prompt_id: null
            variable: true
