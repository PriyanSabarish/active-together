# Migrated draft by Jiabin. No human review or timing measurement is claimed.
templates:
  - template_id: activity_notice_the_change
    title: "Notice the Change"
    category: any
    duration_bucket: 60
    weather_tags: [any]
    site_requirements: [bare_site, open_space]
    equipment: []
    mechanic: find
    safety_tags: [inherited]
    review: {author: Jiabin, reviewed_by: null, status: draft}
    bands:
      "5-7":
        title: null
        steps:
          - sequence: 1
            prompt_text: "Facing me, look at my comfortable hand shape."
            verify_mode: self
            prompt_id: null
            variable: true
          - sequence: 2
            prompt_text: "Watch me change one finger position."
            verify_mode: self
            prompt_id: null
            variable: true
          - sequence: 3
            prompt_text: "Point to the change and show the original shape."
            verify_mode: self
            prompt_id: null
            variable: true
          - sequence: 4
            prompt_text: "Choose a hand shape for me to watch."
            verify_mode: self
            prompt_id: null
            variable: true
          - sequence: 5
            prompt_text: "Change one finger and help me find the difference."
            verify_mode: self
            prompt_id: null
            variable: true
          - sequence: 6
            prompt_text: "Copy my hand shape with your own hand."
            verify_mode: self
            prompt_id: null
            variable: true
          - sequence: 7
            prompt_text: "Change one part and describe our different shapes."
            verify_mode: self
            prompt_id: null
            variable: true
      "8-10":
        title: null
        steps:
          - sequence: 1
            prompt_text: "Observe two comfortable hand positions shown by your adult."
            verify_mode: self
            prompt_id: null
            variable: true
          - sequence: 2
            prompt_text: "Watch one position change while the other stays the same."
            verify_mode: self
            prompt_id: null
            variable: true
          - sequence: 3
            prompt_text: "Identify the change and explain what stayed unchanged."
            verify_mode: self
            prompt_id: null
            variable: true
          - sequence: 4
            prompt_text: "Show your adult a two-part hand pose."
            verify_mode: self
            prompt_id: null
            variable: true
          - sequence: 5
            prompt_text: "Change one part and compare your adult's observation with yours."
            verify_mode: self
            prompt_id: null
            variable: true
          - sequence: 6
            prompt_text: "Choose a smaller visible change in the same pose."
            verify_mode: self
            prompt_id: null
            variable: true
          - sequence: 7
            prompt_text: "Reveal the change and explain which detail helped identify it."
            verify_mode: self
            prompt_id: null
            variable: true
      "11-12":
        title: null
        steps:
          - sequence: 1
            prompt_text: "Choose two visible features of your adult's comfortable hand pose."
            verify_mode: self
            prompt_id: null
            variable: true
          - sequence: 2
            prompt_text: "Observe a change and distinguish it from the unchanged feature."
            verify_mode: self
            prompt_id: null
            variable: true
          - sequence: 3
            prompt_text: "Explain the evidence for your answer and recreate the original pose."
            verify_mode: self
            prompt_id: null
            variable: true
          - sequence: 4
            prompt_text: "Design a pose with one easily described variable."
            verify_mode: self
            prompt_id: null
            variable: true
          - sequence: 5
            prompt_text: "Change that variable and test whether your adult identifies it."
            verify_mode: self
            prompt_id: null
            variable: true
          - sequence: 6
            prompt_text: "Make the change subtler without concealing your hands."
            verify_mode: self
            prompt_id: null
            variable: true
          - sequence: 7
            prompt_text: "Compare the observations and explain which description was most precise."
            verify_mode: self
            prompt_id: null
            variable: true
