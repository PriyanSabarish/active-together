            prompt_text: "Choose one quiet tapping rhythm for me."
            verify_mode: self
            prompt_id: null
            variable: true
          - sequence: 7
            prompt_text: "Tap it softly and compare our rhythms."
            verify_mode: self
            prompt_id: null
            variable: true
      "8-10":
        title: null
        steps:
          - sequence: 1
            prompt_text: "Listen beside your adult with your eyes open."
            verify_mode: self
            prompt_id: null
            variable: true
          - sequence: 2
            prompt_text: "Describe two features of one sound without moving towards it."
            verify_mode: self
            prompt_id: null
            variable: true
          - sequence: 3
            prompt_text: "Compare your description with your adult's observation."
            verify_mode: self
            prompt_id: null
            variable: true
          - sequence: 4
            prompt_text: "Listen to two soft tapping patterns your adult makes."
            verify_mode: self
            prompt_id: null
            variable: true
          - sequence: 5
            prompt_text: "Identify one difference and reproduce your preferred pattern quietly."
            verify_mode: self
            prompt_id: null
            variable: true
          - sequence: 6
            prompt_text: "Make a quiet pattern with a deliberate pause."
            verify_mode: self
            prompt_id: null
            variable: true
          - sequence: 7
            prompt_text: "Ask your adult to describe the pause and compare your answers."
            verify_mode: self
            prompt_id: null
            variable: true
      "11-12":
        title: null
        steps:
          - sequence: 1
            prompt_text: "Choose a sound to describe while staying beside your adult."
            verify_mode: self
            prompt_id: null
            variable: true
          - sequence: 2
            prompt_text: "Separate what you heard from guesses about its source."
            verify_mode: self
            prompt_id: null
            variable: true
          - sequence: 3
            prompt_text: "Compare observations and identify one detail you both heard."
            verify_mode: self
            prompt_id: null
            variable: true
          - sequence: 4
            prompt_text: "Ask your adult for two quiet tapping patterns."
            verify_mode: self
            prompt_id: null
            variable: true
          - sequence: 5
            prompt_text: "Define a rhythm rule that distinguishes the patterns."
            verify_mode: self
            prompt_id: null
            variable: true
          - sequence: 6
            prompt_text: "Make a third soft pattern following your rule."
            verify_mode: self
            prompt_id: null
            variable: true
          - sequence: 7
            prompt_text: "Test your adult's interpretation and explain any ambiguity."
            verify_mode: self
            prompt_id: null
            variable: true
