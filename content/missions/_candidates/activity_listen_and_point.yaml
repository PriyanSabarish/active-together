        steps:
          - sequence: 1
            prompt_text: "Beside me, listen with your eyes open for one sound."
            verify_mode: self
            prompt_id: null
            variable: true
          - sequence: 2
            prompt_text: "Point towards the sound while staying beside me."
            verify_mode: self
            prompt_id: null
            variable: true
          - sequence: 3
            prompt_text: "Describe the sound or copy its rhythm softly."
            verify_mode: self
            prompt_id: null
            variable: true
          - sequence: 4
            prompt_text: "Listen as I make a soft finger tap."
            verify_mode: self
            prompt_id: null
            variable: true
