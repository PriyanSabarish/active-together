# Planning estimates only. These values have not been timed with families.
config_version: "0.1.0"
status: draft
author: Jiabin
timing_basis: author_estimate_not_measured
# Base minutes include each activity's own setup, steps and ending.
# Shared preparation, rest and transitions are additional non-activity blocks.
combo_buckets:
  "20": {activity_count: 2, preparation_minutes: 2, rest_between_minutes: 2, transition_between_minutes: 1}
  "40": {activity_count: 3, preparation_minutes: 3, rest_between_minutes: 3, transition_between_minutes: 1}
  "60": {activity_count: 3, preparation_minutes: 3, rest_between_minutes: 4, transition_between_minutes: 2}
# Extension minutes refer to one use of the indexed, authored adaptation.
# Extra rounds are optional ceilings, not requirements or targets.
activity_profiles:
  - activity_id: balance_shapes
    activity_version: 1
    base_minutes: {"5-7": 3, "8-10": 4, "11-12": 5}
    extension_index: 0
    extension_minutes: 2
    max_extra_rounds: 1
