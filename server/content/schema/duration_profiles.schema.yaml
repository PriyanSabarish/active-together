# Separate planning contract; activity schema v0.1 remains unchanged.
$schema: https://json-schema.org/draft/2020-12/schema
type: object
additionalProperties: false
required: [config_version, status, author, timing_basis, combo_buckets, activity_profiles]
properties:
  config_version: {const: "0.1.0"}
  status: {const: draft}
  author: {type: string, pattern: '\S'}
  timing_basis: {const: author_estimate_not_measured}
  combo_buckets:
    type: object
    additionalProperties: false
    required: ["20", "40", "60"]
    properties:
      "20": {$ref: "#/$defs/bucket"}
      "40": {$ref: "#/$defs/bucket"}
      "60": {$ref: "#/$defs/bucket"}
  activity_profiles:
    type: array
    minItems: 1
    items:
      type: object
      additionalProperties: false
      required: [activity_id, activity_version, base_minutes, extension_index, extension_minutes, max_extra_rounds]
      properties:
        activity_id: {type: string, pattern: '^[a-z][a-z0-9]*(_[a-z0-9]+)*$'}
        activity_version: {type: integer, minimum: 1}
        base_minutes:
          type: object
          minProperties: 1
          propertyNames: {enum: ["5-7", "8-10", "11-12"]}
          additionalProperties: {type: integer, minimum: 1}
        extension_index: {type: integer, minimum: 0}
        extension_minutes: {type: integer, minimum: 1}
        max_extra_rounds: {type: integer, minimum: 0, maximum: 2}
$defs:
  bucket:
    type: object
    additionalProperties: false
    required: [activity_count, preparation_minutes, rest_between_minutes, transition_between_minutes]
    properties:
      activity_count: {type: integer, enum: [2, 3]}
      preparation_minutes: {type: integer, minimum: 0}
      rest_between_minutes: {type: integer, minimum: 0}
      transition_between_minutes: {type: integer, minimum: 0}
