# Content review by lychen, as confirmed by Jiabin. Timing remains unmeasured.
templates:
  - template_id: activity_rhythm_steps
    title: "Rhythm Steps"
    category: any
    duration_bucket: 60
    weather_tags: [dry]
    site_requirements: [bare_site, open_space]
    equipment: []
    mechanic: sequence
    safety_tags: [inherited]
    review: {author: Ritvik, reviewed_by: lychen, status: reviewed}
    bands:
      "5-7":
        title: null
        steps:
          - sequence: 1
            prompt_text: "Beside me, march gently to my slow counting."
            verify_mode: self
            prompt_id: null
            variable: true
            figure: 01_beside_me_march_gently_to_my_slow_counting
          - sequence: 2
            prompt_text: "Pause your feet when my counting pauses."
            verify_mode: self
            prompt_id: null
            variable: true
            figure: 02_pause_your_feet_when_my_counting_pauses
          - sequence: 3
            prompt_text: "Choose a slow count and lead our gentle marching."
            verify_mode: self
            prompt_id: null
            variable: true
            figure: 03_choose_a_slow_count_and_lead_our_gentle_marching
          - sequence: 4
            prompt_text: "Copy two gentle steps followed by a pause."
            verify_mode: self
            prompt_id: null
            variable: true
            figure: 04_copy_two_gentle_steps_followed_by_a_pause
          - sequence: 5
            prompt_text: "Lead that short rhythm and finish with feet still."
            verify_mode: self
            prompt_id: null
            variable: true
            figure: 05_lead_that_short_rhythm_and_finish_with_feet_still
          - sequence: 6
            prompt_text: "Make a different rhythm using slow steps and pauses."
            verify_mode: self
            prompt_id: null
            variable: true
            figure: 06_make_a_different_rhythm_using_slow_steps_and_pauses
          - sequence: 7
            prompt_text: "Teach me your rhythm and finish standing comfortably."
            verify_mode: self
            prompt_id: null
            variable: true
            figure: 07_teach_me_your_rhythm_and_finish_standing_comfortably
      "8-10":
        title: null
        steps:
          - sequence: 1
            prompt_text: "March on the spot to your adult's slow spoken rhythm."
            verify_mode: self
            prompt_id: null
            variable: true
            figure: 01_beside_me_march_gently_to_my_slow_counting
          - sequence: 2
            prompt_text: "Repeat it with a clear pause between groups of steps."
            verify_mode: self
            prompt_id: null
            variable: true
            figure: 02_pause_your_feet_when_my_counting_pauses
          - sequence: 3
            prompt_text: "Lead a short rhythm of your own, then stand still."
            verify_mode: self
            prompt_id: null
            variable: true
            figure: 03_choose_a_slow_count_and_lead_our_gentle_marching
          - sequence: 4
            prompt_text: "Change where the pause falls without increasing speed."
            verify_mode: self
            prompt_id: null
            variable: true
            figure: 04_copy_two_gentle_steps_followed_by_a_pause
          - sequence: 5
            prompt_text: "Try both rhythms and describe how their pauses differ."
            verify_mode: self
            prompt_id: null
            variable: true
            figure: 05_lead_that_short_rhythm_and_finish_with_feet_still
          - sequence: 6
            prompt_text: "Let your adult copy a rhythm you speak."
            verify_mode: self
            prompt_id: null
            variable: true
            figure: 06_make_a_different_rhythm_using_slow_steps_and_pauses
          - sequence: 7
            prompt_text: "Adjust one unclear cue and try the rhythm together."
            verify_mode: self
            prompt_id: null
            variable: true
            figure: 07_teach_me_your_rhythm_and_finish_standing_comfortably
      "11-12":
        title: null
        steps:
          - sequence: 1
            prompt_text: "Design a gentle stepping rhythm with two different pause positions."
            verify_mode: self
            prompt_id: null
            variable: true
            figure: 01_beside_me_march_gently_to_my_slow_counting
          - sequence: 2
            prompt_text: "Teach the rhythm using spoken cues beside your adult."
            verify_mode: self
            prompt_id: null
            variable: true
            figure: 02_pause_your_feet_when_my_counting_pauses
          - sequence: 3
            prompt_text: "Test the cues together and finish with a deliberate pause."
            verify_mode: self
            prompt_id: null
            variable: true
            figure: 03_choose_a_slow_count_and_lead_our_gentle_marching
          - sequence: 4
            prompt_text: "Keep the pace slow while changing one part of the pattern."
            verify_mode: self
            prompt_id: null
            variable: true
            figure: 04_copy_two_gentle_steps_followed_by_a_pause
          - sequence: 5
            prompt_text: "Compare how the changed pause affects coordination."
            verify_mode: self
            prompt_id: null
            variable: true
            figure: 05_lead_that_short_rhythm_and_finish_with_feet_still
          - sequence: 6
            prompt_text: "Create a simpler spoken version of your preferred rhythm."
            verify_mode: self
            prompt_id: null
            variable: true
            figure: 06_make_a_different_rhythm_using_slow_steps_and_pauses
          - sequence: 7
            prompt_text: "Teach that version and explain which cue became clearer."
            verify_mode: self
            prompt_id: null
            variable: true
            figure: 07_teach_me_your_rhythm_and_finish_standing_comfortably