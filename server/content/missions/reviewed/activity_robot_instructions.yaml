# Content review by lychen, as confirmed by Jiabin. Timing remains unmeasured.
templates:
  - template_id: activity_robot_instructions
    title: "Robot Instructions"
    category: any
    duration_bucket: 60
    weather_tags: [dry]
    site_requirements: [bare_site, open_space]
    equipment: []
    mechanic: sequence
    safety_tags: [inherited]
    review: {author: Ritvik, reviewed_by: lychen, status: reviewed}
    bands:
      "5-7":
        title: null
        steps:
          - sequence: 1
            prompt_text: "Beside me, pretend to be a robot moving one arm."
            verify_mode: self
            prompt_id: null
            variable: true
            figure: 01_beside_me_pretend_to_be_a_robot_moving_one_arm
          - sequence: 2
            prompt_text: "Follow my slow arm-up command gently."
            verify_mode: self
            prompt_id: null
            variable: true
            figure: 02_follow_my_slow_arm_up_command_gently
          - sequence: 3
            prompt_text: "Give me an arm-down command and check my robot response."
            verify_mode: self
            prompt_id: null
            variable: true
            figure: 03_give_me_an_arm_down_command_and_check_my_robot_response
          - sequence: 4
            prompt_text: "Choose two comfortable robot arm commands."
            verify_mode: self
            prompt_id: null
            variable: true
            figure: 04_choose_two_comfortable_robot_arm_commands
          - sequence: 5
            prompt_text: "Lead those commands and finish with arms comfortably lowered."
            verify_mode: self
            prompt_id: null
            variable: true
            figure: 05_lead_those_commands_and_finish_with_arms_comfortably_lowered
          - sequence: 6
            prompt_text: "Change one command to make a smaller movement."
            verify_mode: self
            prompt_id: null
            variable: true
            figure: 06_change_one_command_to_make_a_smaller_movement
          - sequence: 7
            prompt_text: "Teach me the smaller movement and try it together."
            verify_mode: self
            prompt_id: null
            variable: true
            figure: 07_teach_me_the_smaller_movement_and_try_it_together
      "8-10":
        title: null
        steps:
          - sequence: 1
            prompt_text: "Agree three gentle robot arm commands with your adult."
            verify_mode: self
            prompt_id: null
            variable: true
            figure: 01_beside_me_pretend_to_be_a_robot_moving_one_arm
          - sequence: 2
            prompt_text: "Follow a short command sequence while keeping your feet grounded."
            verify_mode: self
            prompt_id: null
            variable: true
            figure: 02_follow_my_slow_arm_up_command_gently
          - sequence: 3
            prompt_text: "Lead your own sequence and check whether each command was clear."
            verify_mode: self
            prompt_id: null
            variable: true
            figure: 03_give_me_an_arm_down_command_and_check_my_robot_response
          - sequence: 4
            prompt_text: "Choose one command that could mean two different movements."
            verify_mode: self
            prompt_id: null
            variable: true
            figure: 04_choose_two_comfortable_robot_arm_commands
          - sequence: 5
            prompt_text: "Replace it with clearer words and test the revised instruction."
            verify_mode: self
            prompt_id: null
            variable: true
            figure: 05_lead_those_commands_and_finish_with_arms_comfortably_lowered
          - sequence: 6
            prompt_text: "Ask your adult to reorder two agreed commands."
            verify_mode: self
            prompt_id: null
            variable: true
            figure: 06_change_one_command_to_make_a_smaller_movement
          - sequence: 7
            prompt_text: "Follow the new sequence and describe what changed."
            verify_mode: self
            prompt_id: null
            variable: true
            figure: 07_teach_me_the_smaller_movement_and_try_it_together
      "11-12":
        title: null
        steps:
          - sequence: 1
            prompt_text: "Define three precise commands for comfortable grounded robot movements."
            verify_mode: self
            prompt_id: null
            variable: true
            figure: 01_beside_me_pretend_to_be_a_robot_moving_one_arm
          - sequence: 2
            prompt_text: "Say each command aloud in the order you want it performed."
            verify_mode: self
            prompt_id: null
            variable: true
            figure: 02_follow_my_slow_arm_up_command_gently
          - sequence: 3
            prompt_text: "Test it with your adult and identify one ambiguous instruction."
            verify_mode: self
            prompt_id: null
            variable: true
            figure: 03_give_me_an_arm_down_command_and_check_my_robot_response
          - sequence: 4
            prompt_text: "Revise that instruction without adding a new movement."
            verify_mode: self
            prompt_id: null
            variable: true
            figure: 04_choose_two_comfortable_robot_arm_commands
          - sequence: 5
            prompt_text: "Run the revised sequence and compare how clearly it works."
            verify_mode: self
            prompt_id: null
            variable: true
            figure: 05_lead_those_commands_and_finish_with_arms_comfortably_lowered
          - sequence: 6
            prompt_text: "Design a shorter command sequence with the same final arm position."
            verify_mode: self
            prompt_id: null
            variable: true
            figure: 06_change_one_command_to_make_a_smaller_movement
          - sequence: 7
            prompt_text: "Test your shorter sequence and explain which command was unnecessary."
            verify_mode: self
            prompt_id: null
            variable: true
            figure: 07_teach_me_the_smaller_movement_and_try_it_together