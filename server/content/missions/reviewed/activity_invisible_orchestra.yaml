# Draft. Requires independent human review before runtime use. Timing unmeasured.
templates:
  - template_id: activity_invisible_orchestra
    title: "Invisible Orchestra"
    category: any
    duration_bucket: 40
    weather_tags: [any]
    site_requirements: [bare_site, open_space]
    equipment: []
    mechanic: imagine
    safety_tags: [inherited]
    review: {author: Priyan, reviewed_by: null, status: reviewed}
    bands:
      "5-7":
        title: null
        steps:
          - sequence: 1
            prompt_text: "Find a stick for a photo. Drum with it."
            verify_mode: photo
            prompt_id: p_stick
            variable: true
          - sequence: 2
            prompt_text: "March with me like a band, playing your drum."
            verify_mode: self
            prompt_id: null
            variable: true
          - sequence: 3
            prompt_text: "Find a stone for a photo. Tap a beat on it."
            verify_mode: photo
            prompt_id: p_stone
            variable: true
          - sequence: 4
            prompt_text: "Watch my arms: high means play big, low means tiny."
            verify_mode: self
            prompt_id: null
            variable: true
          - sequence: 5
            prompt_text: "Your turn to conduct. Make me play big and tiny."
            verify_mode: self
            prompt_id: null
            variable: true
      "8-10":
        title: null
        steps:
          - sequence: 1
            prompt_text: "Find a stick and take a photo. Use it to play a big drum, a trumpet, and a cymbal crash with a jump."
            verify_mode: photo
            prompt_id: p_stick
            variable: true
          - sequence: 2
            prompt_text: "Marching band: march around our space playing an instrument, and switch every ten steps."
            verify_mode: self
            prompt_id: null
            variable: true
          - sequence: 3
            prompt_text: "Find a stone and take a photo. Tap out a beat on it for me to copy."
            verify_mode: photo
            prompt_id: p_stone
            variable: true
          - sequence: 4
            prompt_text: "I'll conduct: arms high means big and fast, arms low means small and slow."
            verify_mode: self
            prompt_id: null
            variable: true
          - sequence: 5
            prompt_text: "Your turn to conduct me. Make the music go from tiny to huge and back again."
            verify_mode: self
            prompt_id: null
            variable: true
      "11-12":
        title: null
        steps:
          - sequence: 1
            prompt_text: "Find a stick and take a photo. Then use it to invent a new instrument and show me how you play it with your whole body."
            verify_mode: photo
            prompt_id: p_stick
            variable: true
          - sequence: 2
            prompt_text: "Plan a three-instrument song. Decide which goes first, second and last, then play it."
            verify_mode: self
            prompt_id: null
            variable: true
          - sequence: 3
            prompt_text: "Find a stone and take a photo. Tap out a rhythm for me to copy, then change it."
            verify_mode: photo
            prompt_id: p_stone
            variable: true
          - sequence: 4
            prompt_text: "Make up conducting signals for big, tiny, fast and stop, and teach them to me."
            verify_mode: self
            prompt_id: null
            variable: true
          - sequence: 5
            prompt_text: "Conduct me through your three-instrument song using your signals."
            verify_mode: self
            prompt_id: null
            variable: true