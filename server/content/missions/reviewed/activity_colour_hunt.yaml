# Draft. Requires independent human review before runtime use. Timing unmeasured.
templates:
  - template_id: activity_colour_hunt
    title: "Colour Hunt"
    category: any
    duration_bucket: 40
    weather_tags: [any]
    site_requirements: [bare_site, open_space]
    equipment: []
    mechanic: find
    safety_tags: [inherited]
    review: {author: Priyan, reviewed_by: null, status: reviewed}
    bands:
      "5-7":
        title: null
        steps:
          - sequence: 1
            prompt_text: "Run to something that matches your clothes, then come back."
            verify_mode: self
            prompt_id: null
            variable: true
          - sequence: 2
            prompt_text: "Find something green and something brown. Show me both."
            verify_mode: self
            prompt_id: null
            variable: true
          - sequence: 3
            prompt_text: "Run to three different colours, coming back to me each time."
            verify_mode: self
            prompt_id: null
            variable: true
          - sequence: 4
            prompt_text: "I'll call a colour. Find it before I count to ten."
            verify_mode: self
            prompt_id: null
            variable: true
          - sequence: 5
            prompt_text: "Pick a colour for me. Say hotter or colder."
            verify_mode: self
            prompt_id: null
            variable: true
      "8-10":
        title: null
        steps:
          - sequence: 1
            prompt_text: "Find two things that match your clothes. Run to each one and back."
            verify_mode: self
            prompt_id: null
            variable: true
          - sequence: 2
            prompt_text: "Find three different greens and show me them from darkest to lightest."
            verify_mode: self
            prompt_id: null
            variable: true
          - sequence: 3
            prompt_text: "Rainbow run: stand next to three different colours, coming back to me between each."
            verify_mode: self
            prompt_id: null
            variable: true
          - sequence: 4
            prompt_text: "I'll call a colour. Find it before I count to ten, then try another one even faster."
            verify_mode: self
            prompt_id: null
            variable: true
          - sequence: 5
            prompt_text: "Your turn: pick a colour for me, and say hotter or colder while I hunt."
            verify_mode: self
            prompt_id: null
            variable: true
      "11-12":
        title: null
        steps:
          - sequence: 1
            prompt_text: "Find something that matches your clothes, then find a colour that looks like its opposite."
            verify_mode: self
            prompt_id: null
            variable: true
          - sequence: 2
            prompt_text: "Build a green scale from darkest to lightest. Decide how many steps it has, then show me."
            verify_mode: self
            prompt_id: null
            variable: true
          - sequence: 3
            prompt_text: "Plan a rainbow route of four colours. Tell me the order, then run it."
            verify_mode: self
            prompt_id: null
            variable: true
          - sequence: 4
            prompt_text: "Find as many colours as you can before I count to twenty. Then try to beat your number."
            verify_mode: self
            prompt_id: null
            variable: true
          - sequence: 5
            prompt_text: "Your turn: pick a secret colour, give me three hints, then guide me with hotter or colder."
            verify_mode: self
            prompt_id: null
            variable: true