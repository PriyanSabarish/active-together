# Draft. Requires independent human review before runtime use. Timing unmeasured.
templates:
  - template_id: activity_choose_your_route
    title: "Shape Routes"
    category: any
    duration_bucket: 60
    weather_tags: [dry]
    site_requirements: [bare_site, open_space]
    equipment: []
    mechanic: sequence
    safety_tags: [inherited]
    review: {author: Priyan, reviewed_by: null, status: draft}
    bands:
      "5-7":
        title: null
        steps:
          - sequence: 1
            prompt_text: "Run a big circle around me and come back."
            verify_mode: self
            prompt_id: null
            variable: true
          - sequence: 2
            prompt_text: "Now walk a big square. Stop at each corner."
            verify_mode: self
            prompt_id: null
            variable: true
          - sequence: 3
            prompt_text: "Run a triangle. I'll count the corners with you."
            verify_mode: self
            prompt_id: null
            variable: true
          - sequence: 4
            prompt_text: "Find something round. I'll take a photo of it."
            verify_mode: photo
            prompt_id: shape_round
            variable: true
          - sequence: 5
            prompt_text: "I'll walk a shape. Can you guess what it is?"
            verify_mode: self
            prompt_id: null
            variable: true
          - sequence: 6
            prompt_text: "Find something with corners. Point so I can photograph it."
            verify_mode: photo
            prompt_id: shape_straight_edges
            variable: true
          - sequence: 7
            prompt_text: "Your turn: run any shape you like. I'll guess!"
            verify_mode: self
            prompt_id: null
            variable: true
      "8-10":
        title: null
        steps:
          - sequence: 1
            prompt_text: "Run a square with ten steps on each side. Count out loud."
            verify_mode: self
            prompt_id: null
            variable: true
          - sequence: 2
            prompt_text: "Now a triangle with ten steps on each side. Which shape took fewer steps?"
            verify_mode: self
            prompt_id: null
            variable: true
          - sequence: 3
            prompt_text: "Run a five-point star. If it looks wonky, try it again."
            verify_mode: self
            prompt_id: null
            variable: true
          - sequence: 4
            prompt_text: "Find something shaped like a triangle, then lead me to it so I can photograph it."
            verify_mode: photo
            prompt_id: shape_triangle
            variable: true
          - sequence: 5
            prompt_text: "I'll walk a shape. Guess it, and tell me how many corners it had."
            verify_mode: self
            prompt_id: null
            variable: true
          - sequence: 6
            prompt_text: "Find something with straight edges. Count its corners, then I'll photograph it."
            verify_mode: photo
            prompt_id: shape_straight_edges
            variable: true
          - sequence: 7
            prompt_text: "Your turn: run a tricky shape for me to guess."
            verify_mode: self
            prompt_id: null
            variable: true
      "11-12":
        title: null
        steps:
          - sequence: 1
            prompt_text: "Run a hexagon with the same number of steps on all six sides. Count as you go."
            verify_mode: self
            prompt_id: null
            variable: true
          - sequence: 2
            prompt_text: "Plan the biggest shape that fits our space. Decide the shape and steps per side, then run it."
            verify_mode: self
            prompt_id: null
            variable: true
          - sequence: 3
            prompt_text: "Run your shape while I count, then try again faster with the same steps per side."
            verify_mode: self
            prompt_id: null
            variable: true
          - sequence: 4
            prompt_text: "Find two round things and decide which is the better circle. I'll photograph your pick."
            verify_mode: photo
            prompt_id: shape_round
            variable: true
          - sequence: 5
            prompt_text: "Run a capital letter as a shape. I'll guess which letter it is."
            verify_mode: self
            prompt_id: null
            variable: true
          - sequence: 6
            prompt_text: "Find something with straight edges and count its corners. After I photograph it, run a shape with that many sides."
            verify_mode: photo
            prompt_id: shape_straight_edges
            variable: true
          - sequence: 7
            prompt_text: "Design a shape for me with a rule, like eight sides or no corners. Count while I run it."
            verify_mode: self
            prompt_id: null
            variable: true