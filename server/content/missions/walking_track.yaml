templates:
- template_id: track_look_and_find
  title: Look and find
  category: walking_track
  duration_bucket: 20
  weather_tags:
  - dry
  site_requirements:
  - path
  equipment: []
  mechanic: find
  bands:
    5-7:
      title: null
      steps:
      - sequence: 1
        prompt_text: Walk with me and find a stick on the ground.
        verify_mode: photo
        prompt_id: p_stick
        variable: true
      - sequence: 2
        prompt_text: Point to something taller than you.
        verify_mode: self
        prompt_id: null
        variable: true
      - sequence: 3
        prompt_text: Walk back and count out loud to twenty.
        verify_mode: self
        prompt_id: null
        variable: true
  safety_tags:
