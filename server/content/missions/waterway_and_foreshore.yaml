- template_id: waterside_survey
  title: Waterside survey
  category: waterway_and_foreshore
  duration_bucket: 60
  weather_tags:
  - any
  site_requirements:
  - path
  - water_adjacent
  equipment: []
  mechanic: count
  bands:
    11-12:
      title: null
      steps:
      - sequence: 1
        prompt_text: Walk the path beside the water and set the pace.
        verify_mode: self
        prompt_id: null
        variable: true
      - sequence: 2
        prompt_text: Find where the path comes closest to the water.
        verify_mode: photo
        prompt_id: p_path
        variable: true
      - sequence: 3
        prompt_text: Count how many birds you can see without moving.
        verify_mode: self
        prompt_id: null
