        prompt_text: Stop and listen for thirty seconds.
        verify_mode: self
        prompt_id: null
        variable: true
      - sequence: 6
        prompt_text: Walk back and find one thing you missed.
        verify_mode: self
        prompt_id: null
        variable: true
      - sequence: 7
