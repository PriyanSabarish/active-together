# Draft for review; timing targets are unmeasured.
# 20 minutes: stages 1-3 complete all five core tasks.
# 40 minutes: stages 1-5, including two extension stages.
# Read parent subtask instructions: ../HOME_ACTIVITY_GUIDE.md
templates:
- template_id: activity_home_secret_agent_escape
  title: 'Home: Secret Agent Escape'
  category: any
  duration_bucket: 40
  weather_tags:
  - any
  site_requirements:
  - bare_site
  equipment:
  - paper clue cards
  - pencil
  - rolled socks
  - small towel
  mechanic: sequence
  safety_tags:
  - inherited
  review:
    author: Codex (AI-assisted draft)
    reviewed_by: null
    status: draft
  bands:
    5-7:
      title: null
      steps:
      - sequence: 1
        prompt_text: Find our badge pieces, then follow their route for code cards.
        verify_mode: self
        prompt_id: null
        variable: true
      - sequence: 2
        prompt_text: Deliver our message, then match numbers to actions with me.
        verify_mode: self
        prompt_id: null
        variable: true
      - sequence: 3
        prompt_text: Arrange our code cards, perform the password, and unlock headquarters.
        verify_mode: self
        prompt_id: null
        variable: true
      - sequence: 4
        prompt_text: Carry rescue supplies with me, following our new delivery clues.
        verify_mode: self
        prompt_id: null
        variable: true
      - sequence: 5
        prompt_text: Make a picture trail and teach me your new escape password.
        verify_mode: self
        prompt_id: null
        variable: true
    8-10:
      title: null
      steps:
      - sequence: 1
        prompt_text: Follow the clues to collect and assemble our badge. Then walk its three-symbol route,
          bringing each code card back separately.
        verify_mode: self
        prompt_id: null
        variable: true
      - sequence: 2
        prompt_text: Deliver our request to the station in our clue and retrieve its reply. Match each
          number to an action and teach me.
        verify_mode: self
        prompt_id: null
        variable: true
      - sequence: 3
        prompt_text: Use the final clue to order our code cards. Practise the complete action password,
          then unlock headquarters together.
        verify_mode: self
        prompt_id: null
        variable: true
      - sequence: 4
        prompt_text: Headquarters is open! Follow new delivery clues, carry supplies together and swap
          dispatcher and carrier roles.
        verify_mode: self
        prompt_id: null
        variable: true
      - sequence: 5
        prompt_text: Design a three-station practice escape with a new card order and action password.
          Let me test it, then repair unclear clues.
        verify_mode: self
        prompt_id: null
        variable: true
    11-12:
      title: null
      steps:
      - sequence: 1
        prompt_text: Recover the badge pieces and solve their ordering clues. Follow the resulting route,
          returning each station’s code card to base separately.
        verify_mode: self
        prompt_id: null
        variable: true
      - sequence: 2
        prompt_text: Reject the false delivery instruction using our verified route. Deliver the request,
          retrieve the final clue and teach me the number-action key.
        verify_mode: self
        prompt_id: null
        variable: true
      - sequence: 3
        prompt_text: Use the final clue to order the code. Explain your reasoning, correct a rehearsal
          mistake and lead our complete action password to unlock headquarters.
        verify_mode: self
        prompt_id: null
        variable: true
      - sequence: 4
        prompt_text: Plan a supply mission using new destination clues and one decoy. Swap dispatcher
          and carrier, checking each delivery against the verified route.
        verify_mode: self
        prompt_id: null
        variable: true
      - sequence: 5
        prompt_text: Create a solvable three-station practice escape with an ordering clue and a new action
          password. Test it on me, then improve the clues.
        verify_mode: self
        prompt_id: null
        variable: true
