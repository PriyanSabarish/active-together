# Development sample. Requires independent human review before runtime use.
schema_version: "0.1.0"
activity_id: pass_and_move
version: 1
title: Pass and Move
summary: Roll a soft ball to a partner, then change position together for the next pass.
activity_type: ball_play
core_mechanic: pass

participation:
  minimum_children: 1
  minimum_adults: 1
  adult_role: Roll the ball gently, agree each position and retrieve loose balls only when appropriate.

equipment:
  required:
    - A soft ball suitable for rolling between the child and adult.
  optional: []

requirements:
  - An adult checks a level, clear area where a ball can roll without entering traffic or active play.
  - There is room for the pair to change position without contacting other people.
  - The family brings the ball; the location dataset does not establish equipment availability.

setup:
  - Face each other a short, comfortable rolling distance apart.
  - Agree to roll along the ground and stop the ball before changing position.
  - Agree that the child will wait if the ball leaves the checked area.
  - Either person can pause, move closer or end the game at any point.

age_variants:
  "5-7":
    challenge: Stop and return a gentle roll, then move to an agreed position.
    steps:
      - step_id: receive_roll
        instruction: Stop the ball I roll towards you.
        parent_prompt: Roll gently from nearby and let the child choose a comfortable way to stop it.
      - step_id: return_roll
        instruction: Roll the ball back towards me.
        parent_prompt: Stay close and make the receiving position easy to see.
      - step_id: change_position
        instruction: Hold the ball while we each take one sideways step.
        parent_prompt: Check room first, move together, then stop and exchange another gentle roll.
    ending: Stop the ball after one final exchange and finish together.

  "8-10":
    challenge: Compare two rolling distances and choose one that helps the pair cooperate.
    steps:
      - step_id: try_near
        instruction: Exchange two gentle rolls from our starting positions.
        parent_prompt: Stop the ball between turns and count exchanges together without scoring.
      - step_id: try_distance
        instruction: Hold the ball while we choose a second rolling distance.
        parent_prompt: Agree a small change within the checked area, stop moving, then exchange two rolls.
      - step_id: choose_distance
        instruction: Choose which distance made the ball easier to control.
        parent_prompt: Move to the chosen positions while holding the ball, then try another exchange.
    ending: Stop the ball and describe which distance worked for you both.

  "11-12":
    challenge: Plan and improve a short pattern of positions for cooperative rolling.
    steps:
      - step_id: plan_positions
        instruction: Choose two nearby positions for our rolling pattern.
        parent_prompt: Agree positions within the checked area; no markers or field lines are needed.
      - step_id: try_pattern
        instruction: Guide us through one exchange at each position.
        parent_prompt: Hold the ball during every position change and roll only when both people are still.
      - step_id: improve_pattern
        instruction: Change one position to make the next exchange easier to control.
        parent_prompt: Discuss the change, move while holding the ball and repeat the adjusted pattern.
    ending: Stop the ball after the adjusted pattern and name the change together.

adaptations:
  simplify:
    - Stay in one position and shorten the distance between partners.
    - Stop each roll with help from the adult before taking another turn.
  extend:
    - Swap who chooses the positions while keeping the same checked area and rolling rules.
    - Treat the same gentle rolls as delivering an imaginary parcel.

constraints:
  - Roll on the ground; do not add throwing, kicking, striking or speed targets.
  - Stop and hold the ball before changing position; do not chase a moving ball.
  - If the ball leaves the checked area, the child waits with the activity paused.
  - Do not assume nets, hoops, painted lines, markers or supplied equipment.
  - Keep the rolling and position-change rules when adding story wording.
safety_reference: schema/safety_constraints.yaml

review:
  author: Jiabin
  reviewed_by: null
  status: draft
